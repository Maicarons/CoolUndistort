<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoolUndistort</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>CoolUndistort</h1>
      <section class="controls">
        <input id="file" type="file" accept="image/*" />
        <select id="task">
          <option value="t1">T1 人像校正</option>
          <option value="t2" selected>T2 广角整形</option>
          <option value="t3">T3 拼接整形</option>
          <option value="t4">T4 旋转校正</option>
        </select>
        <select id="mode">
          <option value="fisheye" selected>除法模型基线</option>
          <option value="tps">RP-TPS (P1)</option>
          <option value="checkpoint">UniRect-lite 权重 (P1)</option>
        </select>
        <label>λ <input id="lambda" type="number" step="0.05" value="0.35" style="width: 5em" /></label>
        <button id="run">去畸变</button>
        <span id="status">纯 Rust 本地推理，无需后端服务</span>
      </section>
      <section class="views">
        <figure><figcaption>原图</figcaption><img id="before" alt="before" /></figure>
        <figure><figcaption>结果</figcaption><img id="after" alt="after" /></figure>
      </section>
      <footer>AGPL-3.0-or-later · <span>源码见仓库 LICENSE</span></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
