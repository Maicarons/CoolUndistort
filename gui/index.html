<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoolUndistort</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>CoolUndistort <small>纯 Rust 本地推理</small></h1>
      <section class="controls">
        <input id="file" type="file" accept="image/*" multiple />
        <select id="task">
          <option value="t1">T1 人像校正</option>
          <option value="t2" selected>T2 广角整形</option>
          <option value="t3">T3 拼接整形</option>
          <option value="t4">T4 旋转校正</option>
        </select>
        <select id="mode">
          <option value="auto" selected>自动盲估计（内置权重）</option>
          <option value="fisheye">除法模型（手动 λ）</option>
          <option value="tps">RP-TPS</option>
          <option value="checkpoint">UniRect-lite 权重</option>
        </select>
        <button id="run">去畸变</button>
        <button id="save">保存结果</button>
        <span id="status">就绪</span>
      </section>
      <section class="params">
        <details open>
          <summary>标定参数</summary>
          <label>λ <input id="lambda" type="number" step="0.05" value="0.35" /></label>
          <label>calib.json <input id="calib" type="file" accept=".json" /></label>
          <label>T4 倾角° <input id="angle" type="number" step="0.5" value="0" /></label>
        </details>
        <details>
          <summary>TPS / 权重（P1）</summary>
          <label>deltas.json <input id="deltas" type="file" accept=".json" /></label>
          <label>grid <input id="grid" value="10x12" /></label>
          <label>model.onnx 路径 <input id="onnx" placeholder="weights/autolambda.onnx（默认内置）" /></label>
        </details>
      </section>
      <section class="compare">
        <div class="imgwrap">
          <img id="before" alt="before" />
          <img id="after" alt="after" />
          <input id="slider" type="range" min="0" max="100" value="50" />
        </div>
        <div class="legend"><span>◀ 原图</span><span>结果 ▶</span></div>
      </section>
      <section class="batch">
        <h2>批量队列 <button id="clear">清空</button></h2>
        <ul id="queue"></ul>
      </section>
      <footer>
        AGPL-3.0-or-later · 源码见仓库 LICENSE ·
        <a href="https://github.com/Maicarons/CoolUndistort" target="_blank">GitHub</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
