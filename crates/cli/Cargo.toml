[package]
name = "coolundistort-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "CoolUndistort CLI: calibration/batch/eval, pure Rust"

[[bin]]
name = "coolundistort"
path = "src/main.rs"

[dependencies]
coolundistort-infer = { path = "../infer" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
